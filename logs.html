<!DOCTYPE html>
<html lang="zh-CN" data-page-perm="logs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>操作日志 - 多模态工业智能监控平台</title>
  <link rel="stylesheet" href="./css/admin.css">
  <script src="./js/auth.js"></script>
</head>
<body>

<div class="admin-layout">

  <!-- 左侧导航 -->
  <aside class="admin-sidebar">
    <div class="admin-logo">工业智能监控平台</div>
    <nav class="admin-menu">
      <div class="menu-group">监控</div>
      <a href="./index.html">实时监控</a>
      <div class="menu-group">安全</div>
      <a href="./alarms.html">告警管理</a>
      <div class="menu-group">报表</div>
      <a href="./dashboard.html">数据总览</a>
      <a href="./reports.html" data-perm="report">统计报表</a>
      <div class="menu-group">设备</div>
      <a href="./devices.html" data-perm="device">设备管理</a>
      <div class="menu-group">系统</div>
      <a href="./settings.html" data-perm="settings">系统配置</a>
      <a href="./logs.html" class="active" data-perm="logs">操作日志</a>
    </nav>
    <div class="admin-user">
      <span class="admin-user-name" data-user-name>—</span>
      <span data-user-role></span>
      <a href="javascript:void(0)" data-logout>退出登录</a>
    </div>
  </aside>

  <!-- 右侧内容 -->
  <main class="admin-main">
    <h1 class="admin-page-title">操作日志</h1>
    <p class="admin-page-sub">关键操作全程留痕 · 登录、告警处理、设备变更、配置修改、证据下载</p>

    <div class="admin-card">
      <div class="filter-bar">
        <div class="filter-item">
          <label>开始时间</label>
          <input type="datetime-local" id="startTime">
        </div>
        <div class="filter-item">
          <label>结束时间</label>
          <input type="datetime-local" id="endTime">
        </div>
        <div class="filter-item">
          <label>操作用户</label>
          <select id="userFilter">
            <option value="">全部</option>
          </select>
        </div>
        <div class="filter-item">
          <label>操作类型</label>
          <select id="typeFilter">
            <option value="">全部</option>
          </select>
        </div>
        <button class="btn btn-primary" id="btnSearch">查询</button>
        <button class="btn" id="btnReset">重置</button>
      </div>

      <div class="filter-bar" style="padding-top:0;border-bottom:none;">
        <span class="range-tip" id="totalTip">共 0 条日志</span>
      </div>

      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th style="width:170px;">时间</th>
              <th style="width:120px;">操作用户</th>
              <th style="width:120px;">操作类型</th>
              <th>详情</th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr><td colspan="4" class="empty-state">加载中...</td></tr>
          </tbody>
        </table>
      </div>

      <div class="pagination" id="pagination"></div>
    </div>
  </main>
</div>

<script src="./js/logs.js"></script>
</body>
</html>
