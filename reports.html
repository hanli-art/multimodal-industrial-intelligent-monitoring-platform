<!DOCTYPE html>
<html lang="zh-CN" data-page-perm="report">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>统计报表 - 多模态工业智能监控平台</title>
  <link rel="stylesheet" href="./css/admin.css">
  <script src="./js/auth.js"></script>
</head>
<body>

<div class="admin-layout">

  <!-- 左侧导航 -->
  <aside class="admin-sidebar">
    <div class="admin-logo">工业智能监控平台</div>
    <nav class="admin-menu">
      <div class="menu-group">监控</div>
      <a href="./index.html">实时监控</a>
      <div class="menu-group">安全</div>
      <a href="./alarms.html">告警管理</a>
      <div class="menu-group">报表</div>
      <a href="./dashboard.html">数据总览</a>
      <a href="./reports.html" class="active" data-perm="report">统计报表</a>
      <div class="menu-group">设备</div>
      <a href="./devices.html" data-perm="device">设备管理</a>
      <div class="menu-group">系统</div>
      <a href="./settings.html" data-perm="settings">系统配置</a>
    </nav>
    <div class="admin-user">
      <span class="admin-user-name" data-user-name>—</span>
      <span data-user-role></span>
      <a href="javascript:void(0)" data-logout>退出登录</a>
    </div>
  </aside>

  <!-- 右侧内容 -->
  <main class="admin-main">
    <h1 class="admin-page-title">统计报表</h1>
    <p class="admin-page-sub">隐患台账 · 按日 / 周 / 月维度查询，支持导出 CSV</p>

    <div class="admin-card">
      <div class="filter-bar">
        <div class="tabs">
          <button class="tab active" data-period="day">日报表</button>
          <button class="tab" data-period="week">周报表</button>
          <button class="tab" data-period="month">月报表</button>
        </div>
        <div class="filter-item">
          <label>违规行为</label>
          <select id="typeFilter">
            <option value="">全部</option>
            <option value="抽烟">抽烟</option>
            <option value="未戴安全帽">未戴安全帽</option>
            <option value="打架斗殴">打架斗殴</option>
            <option value="火灾">火灾</option>
            <option value="攀爬围墙">攀爬围墙</option>
          </select>
        </div>
        <div class="filter-item">
          <label>处理状态</label>
          <select id="statusFilter">
            <option value="">全部</option>
            <option value="待处理">待处理</option>
            <option value="已处理">已处理</option>
            <option value="已驳回">已驳回</option>
          </select>
        </div>
        <button class="btn btn-primary" id="btnSearch">查询</button>
        <button class="btn" id="btnReset">重置</button>
        <button class="btn" id="btnExport" style="margin-left:auto;">导出 CSV</button>
      </div>

      <div class="filter-bar" style="padding-top:0;border-bottom:none;">
        <span class="range-tip" id="rangeTip">统计范围：—</span>
        <span class="range-tip" id="totalTip" style="margin-left:auto;"></span>
      </div>

      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>隐患编号</th>
              <th>时间</th>
              <th>地点</th>
              <th>违规行为</th>
              <th>状态</th>
            </tr>
          </thead>
          <tbody id="tbody">
            <tr><td colspan="5" class="empty-state">加载中...</td></tr>
          </tbody>
        </table>
      </div>

      <div class="pagination" id="pagination"></div>
    </div>
  </main>
</div>

<script src="./js/reports.js"></script>
</body>
</html>
